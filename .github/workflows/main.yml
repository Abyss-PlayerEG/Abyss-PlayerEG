name: Profile README

# 统一入口：所有触发条件集中在这里，具体工作拆分到同目录的模块 workflow
on:
  push:
    branches:
      - master
  schedule:
    - cron: "30 19 * * *" # 北京时间每天 03:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 蛇形贡献动画 → output 分支
  snake:
    uses: ./.github/workflows/snake.yml

  # 统计卡片 → output 分支（排在 snake 之后，避免两个 job 同时 push 同一分支）
  # push 时不运行，只在定时/手动时更新
  stats:
    needs: snake
    if: github.event_name != 'push'
    secrets: inherit
    uses: ./.github/workflows/stats.yml
