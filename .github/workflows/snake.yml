name: Snake Animation

# 模块：生成贡献蛇形动画并发布到 output 分支
on:
  workflow_call:
  workflow_dispatch: # 也可单独手动触发

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 生成蛇形 SVG 到 dist/
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # gh-pages 部署会强制覆盖 output 分支，先把已有的 stats.svg 保留下来
      - name: Preserve stats.svg from output branch
        run: |
          git fetch --depth 1 origin output || true
          git show FETCH_HEAD:stats.svg > dist/stats.svg 2>/dev/null || true

      # 将 dist/ 内容发布到 output 分支
      # 内容可通过 https://raw.githubusercontent.com/<user>/<repo>/output/<file> 访问
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
