name: Update GitHub Stats

on:
  schedule:
    # 每天 UTC 02:00 运行（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate terminal SVG
        uses: williamzujkowski/svg-terminal@v1
        with:
          config: terminal.yml
          output: img/terminal.svg
          cache-mode: refresh

      - name: Push terminal.svg to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存生成的 SVG
          cp img/terminal.svg /tmp/terminal.svg

          # 切到 output 分支（保留已有的 snake 文件）
          git fetch --depth 1 origin output
          git checkout -B output FETCH_HEAD

          # 更新 SVG
          cp /tmp/terminal.svg terminal.svg

          if git diff --quiet -- terminal.svg; then
            echo "No changes to commit"
            exit 0
          fi

          git add terminal.svg
          git commit -m "chore: update terminal SVG"
          git push origin output
