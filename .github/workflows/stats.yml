name: Update GitHub Stats

on:
  schedule:
    # 每天 UTC 02:00 运行（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Generate info card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUTPUT_DIR: img
        run: python scripts/generate_card.py

      - name: Push stats.svg to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存生成的 SVG
          cp img/stats.svg /tmp/stats.svg

          # 切到 output 分支（保留已有的 snake 文件）
          git fetch --depth 1 origin output
          git checkout -B output FETCH_HEAD

          # 更新 SVG
          cp /tmp/stats.svg stats.svg
          git add stats.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update stats card"
          git push origin output
