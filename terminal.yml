theme:
  name: catppuccin-macchiato
  colors:
    text: "#cad3f5"
    comment: "#939ab7"
    background: "#24273a"
    titleBarBackground: "#1e2030"
    titleBarText: "#cad3f5"
    prompt: "#a6da95"
    cursor: "#f4dbd6"
    red: "#ed8796"
    green: "#a6da95"
    yellow: "#eed49f"
    blue: "#8aadf4"
    magenta: "#c6a0f6"
    cyan: "#8bd5ca"
    white: "#b8c0e0"
    orange: "#f5a97f"
    purple: "#c6a0f6"
    pink: "#f5bde6"
    brightRed: "#ed8796"
    brightGreen: "#a6da95"
    brightYellow: "#eed49f"
    brightBlue: "#8aadf4"
    brightMagenta: "#c6a0f6"
    brightCyan: "#8bd5ca"
    brightWhite: "#cad3f5"
    brightBlack: "#5b6078"
  buttons:
    close: "#ed8796"
    minimize: "#eed49f"
    maximize: "#a6da95"

window:
  title: "playereg@PlayerEG-MAC"
  style: macos
  width: 820
  height: 620

terminal:
  fontFamily: "Menlo, Monaco, 'Courier New', monospace"
  fontSize: 13
  lineHeight: 1.5
  prompt: "playereg@PlayerEG-MAC ~ % "

effects:
  textGlow: false
  scanlines: false

blocks:
  - block: neofetch
    config:
      username: playereg
      hostname: PlayerEG-MAC
      os: "macOS Golden Gate 27.2.1 (26B131) arm64"
      shell: "zsh 5.9"
      role: "Developer | Gamer | Creator"
      languages: "Python, Java, JavaScript, Go, Vue"
      editor: "VS Code"
      command: "fastfetch"

  - block: github-stats
    config:
      username: Abyss-PlayerEG

  - block: github-languages
    config:
      username: Abyss-PlayerEG
      top: 5
      barWidth: 20
      command: "gh languages"

  - block: palette-swatch
    config:
      command: "echo"
      label: "Catppuccin Macchiato"
